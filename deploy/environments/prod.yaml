environment: prod
model_endpoint: https://openrouter.ai/api/v1   # AI gateway (OpenRouter)
region: local-sim
mode: shadow            # shadow | assisted | full
feature_flags:
  straight_through_enabled: false
  payments_enabled: false
  kill_switch: false
limits:
  max_cost_per_claim_usd: 0.25
  max_agent_steps: 40
llm_mode: auto          # auto (live if OPENROUTER_API_KEY set, else mock) | live | mock
