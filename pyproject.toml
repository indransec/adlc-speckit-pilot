[project]
name = "travel-claims-assistant"
version = "0.1.0"
description = "Agentic travel claims assistant - ADLC pilot (LangGraph + OpenRouter + FAISS + SQLite + FastAPI + Streamlit)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # orchestration + AI gateway
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    # retrieval
    "faiss-cpu>=1.9",
    "fastembed>=0.5",
    # guardrails
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "preshed<3.0.14",  # 3.0.14 breaks en_core_web_sm 3.8.0 load (OverflowError)
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # documents
    "reportlab>=4.2",
    "pypdf>=5.0",
    # backend / frontend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "streamlit>=1.40",
    "pandas>=2.2",
    "altair>=5.4",
    # platform
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    # observability (OTel GenAI / OpenInference -> Arize Phoenix)
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-langchain>=0.1.29",
    "opentelemetry-sdk>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "arize-phoenix>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "agents/orchestrator/src"]
testpaths = ["agents", "tests"]
python_files = ["test_*.py"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning"]
