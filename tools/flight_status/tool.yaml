id: TOOL-FLIGHT-STATUS
description: Historical flight delay and cancellation data.
owner: claims-platform (simulated system of record)
auth_scope: read
side_effects: none
rate_limit: 60 calls/min
timeout_seconds: 10
retries: 2
input_schema: see operations.*.input
output_schema: see operations.*.output
implementation: tools/flight_status/impl.py (mock; enforced via shared/tool_gateway.py)
operations:
  lookup:
    access: read
    input:
      flight_no: string
      flight_date: date
    output:
      flight: object {scheduled_dep, actual_dep, delay_minutes, cause, cause_announced_at} | null
