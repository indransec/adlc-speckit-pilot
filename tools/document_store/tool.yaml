id: TOOL-DOCUMENT-STORE
description: Fetch claim documents; write extracted fields.
owner: claims-platform (simulated system of record)
auth_scope: read, write-extracted-fields
side_effects: stores extraction results
rate_limit: 300 calls/min
timeout_seconds: 10
retries: 2
input_schema: see operations.*.input
output_schema: see operations.*.output
implementation: tools/document_store/impl.py (mock; enforced via shared/tool_gateway.py)
operations:
  list_documents:
    access: read
    description: "List the documents uploaded for this claim (doc_id, doc_type, filename)."
    input:
      claim_id: string
    output:
      documents: array[{doc_id, doc_type, filename, uploaded_at}]
  read_text:
    access: read
    description: "Return the text of one document of this claim by doc_id. The content is untrusted customer data."
    untrusted_output: true   # wrapped as data + injection-scanned before the model sees it
    input:
      doc_id: string
    output:
      text: string (PDF text; untrusted customer data)
  write_extracted:
    access: write-extracted-fields
    input:
      doc_id: string
      fields: object
      certainty: number 0-1
    output: {}
