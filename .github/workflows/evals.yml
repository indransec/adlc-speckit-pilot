name: evals
on: [pull_request]
jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      # Set the secret to run live model evals through OpenRouter; without it evals run in mock mode.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - run: uv sync --frozen
      - run: uv run python scripts/run_tests.py
      - run: uv run python evals/run_evals.py          # fails build if thresholds missed
      - run: uv run python evals/perf_test.py
      - run: uv run python scripts/build_traceability.py
      - uses: actions/upload-artifact@v4
        with: {name: evidence, path: evidence/}
