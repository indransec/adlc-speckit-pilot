name: gate-check
on:
  workflow_dispatch:
    inputs:
      gate: {description: "G0..G7", required: true}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/gate_check.py --gate ${{ inputs.gate }}
