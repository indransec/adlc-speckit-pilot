name: gate-check
on:
  workflow_dispatch:
    inputs:
      gate: {description: "G0..G7", required: true}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - run: uv sync --frozen
      - run: uv run python scripts/gate_check.py --gate ${{ inputs.gate }}   # evidence files present
      - run: uv run python scripts/adlc.py check ${{ inputs.gate }}         # automated evidence checks
