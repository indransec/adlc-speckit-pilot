name: test
on: [pull_request, push]
jobs:
  unit-and-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - run: uv sync --frozen
      - run: uv run python scripts/run_tests.py            # pytest; writes evidence/<release>/test-report.json
      - uses: actions/upload-artifact@v4
        with: {name: test-report, path: evidence/*/test-report.json}
