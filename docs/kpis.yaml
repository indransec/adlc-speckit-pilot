# KPI baseline and targets (metric realisation)
kpis:
  - id: KPI-01
    name: Average handling time, delay + baggage
    baseline: "[measure from last 6 months]"
    target: "-40%"
    source: claims system timestamps
  - id: KPI-02
    name: Straight-through processing rate
    baseline: 0%
    target: 15-25% (conservative MVP routing)
    source: routing decisions
  - id: KPI-03
    name: Adjuster minutes per claim
    baseline: "[time study]"
    target: "-30%"
    source: workbench activity
  - id: KPI-04
    name: Payment accuracy (QA sample)
    baseline: "[current QA error rate]"
    target: ">= baseline"
    source: weekly QA sample
  - id: KPI-05
    name: Human override rate of agent recommendation
    baseline: n/a
    target: "< 15%"
    source: L1/L2 decisions
  - id: KPI-06
    name: Customer complaints per 1,000 claims
    baseline: "[current]"
    target: "<= baseline"
    source: complaints log
  # Release 0.4.0: missed connection benefit (CARD-101); figures from the card, Business owner confirms at G1
  - id: KPI-07
    name: Missed-connection complaints per month
    baseline: "[40]"
    target: "[10]"
    source: complaints log
  - id: KPI-08
    name: Goodwill payments outside the claims system (missed connection)
    baseline: "[USD 12,000 / month]"
    target: "[0]"
    source: finance ledger
  - id: KPI-09
    name: Decision time for a missed-connection claim
    baseline: "[9 days, manual]"
    target: "[2 days]"
    source: claims system timestamps
