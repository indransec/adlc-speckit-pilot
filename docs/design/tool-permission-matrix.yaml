# Which agent may use which tool, and how
tools:
  - id: TOOL-POLICY-ADMIN
    agents: [coverage]
    access: read
    side_effects: none
    note: includes per-policy claims history for duplicate detection REQ-F-013
  - id: TOOL-CLAIMS-SYSTEM
    agents: [intake, orchestrator]
    access: create, update-status, read
    side_effects: claim record changes (no payment fields)
    note: read added for linked-claim aggregation REQ-F-015 (decision D-07)
  - id: TOOL-FLIGHT-STATUS
    agents: [verification]
    access: read
    side_effects: none
  - id: TOOL-DOCUMENT-STORE
    agents: [document]
    access: read, write-extracted-fields
    side_effects: stores extraction results
  - id: TOOL-FRAUD-SCORE
    agents: [fraud-screening]
    access: read
    side_effects: none
  - id: TOOL-PAYMENTS
    agents: [settlement]
    access: create-instruction
    side_effects: money movement
    precondition: valid approval token (ADR-003)
  - id: TOOL-NOTIFY
    agents: [communication]
    access: send-from-template
    side_effects: customer communication
