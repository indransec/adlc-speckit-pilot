# Behavioural requirements - how the agents must (and must not) act
requirements:
  - id: REQ-B-001
    text: The agent decides alone only when approved aggregate <= USD 1,000, there is no deduction, fraud risk is low and confidence >= 0.7.
    verification: [test:routing, eval:routing]
  - id: REQ-B-002
    text: The agent never rejects a claim, fully or partly, without human approval.
    verification: [test:routing, eval:routing]
  - id: REQ-B-003
    text: Any type B deduction, or a total reduction above 25% of the claimed amount, requires L1 review and L2 final decision.
    verification: [test:routing, eval:deduction-classification]
  - id: REQ-B-004
    text: A type B deduction without a linked evidence reference is routed to investigation (row 6), never to the approval chain.
    verification: [test:routing, eval:evidence-linking]
  - id: REQ-B-005
    text: No payment instruction is created before the last required approval.
    verification: [test:settlement, rai:red-team]
  - id: REQ-B-006
    text: L1 and L2 approvers are different users and L2 has higher authority.
    verification: [test:hitl]
  - id: REQ-B-007
    text: Fraud screening flags claims; it never rejects them.
    verification: [test:routing]
  - id: REQ-B-008
    text: Customer messages use approved templates and cite the policy clause for any deduction.
    verification: [eval:letters]
  - id: REQ-B-009
    text: Personal data is redacted from logs and from model inputs that do not need it; bank details never reach a model.
    verification: [rai:pii-suite]
  - id: REQ-B-010
    text: Instructions found inside customer documents are treated as data and never followed.
    verification: [rai:injection-suite]
  - id: REQ-B-011
    text: When the agent cannot reach a judgement (confidence < 0.7, conflicting documents, ambiguous wording) it routes to L1 with the reason.
    verification: [eval:routing]
  # Release 0.4.0: missed connection benefit (CARD-101)
  - id: REQ-B-012
    text: The agent never pays a missed connection claim unless the inbound delay is verified by the flight status source and the booked connection met the minimum connection time; otherwise it routes to a person.
    verification: [test:routing, eval:routing]
  - id: REQ-B-013
    text: The agent never attributes a delay to a leg other than the inbound leg of the missed connection; when legs are ambiguous it routes to L1 with the reason.
    verification: [eval:edge-cases]
