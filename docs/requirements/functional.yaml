# Functional requirements - what the system must do
requirements:
  - id: REQ-F-001
    text: Register each submitted claim, assign a claim ID and classify it as delay, baggage, missed connection or a combination within 5 minutes; a combined delay + missed connection claim stays one claim with each expense line assessed under its own clause.
    verification: [eval:intake-classification, test:intake]
  - id: REQ-F-002
    text: Send an acknowledgement with claim ID and next steps to the customer.
    verification: [test:communication-templates]
  - id: REQ-F-004
    text: Extract name, policy number, travel dates, flight number, amounts and currency from all attached documents and cross-check them for consistency.
    verification: [eval:document-extraction]
  - id: REQ-F-005
    text: Check document completeness against the checklist for each claim type.
    verification: [eval:document-completeness]
  - id: REQ-F-006
    text: Request missing documents, send reminders on day 3 and day 7, and close the claim as incomplete on day [30].
    verification: [test:document-chasing]
  - id: REQ-F-010
    text: Confirm the policy was active on the travel dates and the claimant is an insured person.
    verification: [eval:coverage]
  - id: REQ-F-011
    text: Map the claim to benefit sections and identify applicable exclusions.
    verification: [eval:coverage]
  - id: REQ-F-012
    text: Apply excess, sub-limits, benefit caps, currency conversion at the policy rule date, and offsets for compensation already received.
    verification: [test:calculation, eval:amount-accuracy]
  - id: REQ-F-013
    text: Detect duplicate claims for the same event.
    verification: [eval:edge-cases]
  - id: REQ-F-014
    text: Verify flight delay facts against the licensed flight status source.
    verification: [eval:verification]
  - id: REQ-F-015
    text: Aggregate approved amounts across the claim and any claims linked to the same trip or event.
    verification: [test:routing, eval:edge-cases]
  - id: REQ-F-016
    text: Obtain a fraud risk level (low, medium, high) for each claim.
    verification: [test:fraud-integration]
  - id: REQ-F-020
    text: Label every deduction line as type A (policy-norm) or type B (judgement) with the policy clause and evidence reference.
    verification: [eval:deduction-classification]
  - id: REQ-F-021
    text: Produce a decision package with recommended outcome, amount, line-by-line deductions, clauses, evidence and confidence.
    verification: [eval:decision-package]
  - id: REQ-F-025
    text: Route each claim according to the routing matrix rows 1-7.
    verification: [test:routing, eval:routing]
  - id: REQ-F-030
    text: Create a payment instruction only after the final required approval, and verify the account holder matches the claimant.
    verification: [test:settlement]
  - id: REQ-F-031
    text: Send the decision letter with breakdown, clause citations for any deduction, and appeal rights.
    verification: [eval:letters, rai:letter-review]
  # Release 0.4.0: missed connection benefit (CARD-101, specs/0.4.0-missed-connection/spec.md)
  - id: REQ-F-032
    text: For a missed connection claim, check completeness - bookings or boarding passes for the inbound and onward legs, and receipts for rebooking, accommodation and meals - and request what is missing.
    verification: [eval:document-completeness, test:document-chasing]
  - id: REQ-F-033
    text: Extract every itinerary leg and identify the inbound leg that arrives at the onward leg's departure airport.
    verification: [eval:document-extraction, eval:edge-cases]
  - id: REQ-F-034
    text: Verify the inbound leg's actual arrival and delay cause with the flight status source; route to investigation when source and documents disagree.
    verification: [eval:verification]
  - id: REQ-F-035
    text: Check the booked connection time against the connection airport's published minimum connection time (60 minutes when none is published) and record the value used and its source.
    verification: [eval:coverage, test:calculation]
  - id: REQ-F-036
    text: Assess missed connection eligibility against the missed connection clause, covered causes (3.2), delay exclusions (3.3), late check-in, and single-ticket booking (self-transfer on separate tickets is not covered); no minimum inbound delay applies.
    verification: [eval:coverage]
  - id: REQ-F-037
    text: Calculate the missed connection payable amount - reasonable ticket cost (economy or the originally booked class), necessary receipted accommodation and meals with no separate caps (non-essential excluded, 3.5), the plan's travel delay limit per journey (USD 500 Standard, USD 1,000 Premier), compensation offset including any refund for the unused onward ticket (3.4), receipt rule (6.1) and currency conversion (6.2).
    verification: [test:calculation, eval:amount-accuracy]
  - id: REQ-F-038
    text: Across travel delay and missed connection claims or lines for the same journey (outward and return are separate journeys), in whichever order they are claimed, deduct any expense already paid and cap both benefits together at one travel delay limit per journey.
    verification: [test:calculation, eval:edge-cases]
  - id: REQ-F-039
    text: Send the missed connection decision letter from the approved template with breakdown, clause citations and appeal rights.
    verification: [eval:letters, rai:letter-review]
