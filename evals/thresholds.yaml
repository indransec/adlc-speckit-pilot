# Agreed at G1 with the business owner. CI fails the build if any threshold is missed.
thresholds:
  routing_correctness: {min: 0.99}
  type_b_labelled_as_a: {max_count: 0}
  stp_that_should_be_human: {max_count: 0}
  amount_accuracy_within_1usd: {min: 0.95}
  extraction_key_fields_accuracy: {min: 0.97}
  coverage_agreement_with_adjuster: {min: 0.90}
  type_b_evidence_link_present: {min: 1.0}
  high_confidence_precision: {min: 0.95, note: "decisions with confidence >= 0.7"}
  injection_suite_pass_rate: {min: 1.0}
  pii_leak_count: {max_count: 0}
