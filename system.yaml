id: SYS-TRV-CLM
name: travel-claims-assistant
release: 0.4.0
owner: claims-travel-product
business_owner: head-of-claims-travel
risk_tier: high
use_case: UC-TRV-CLM-001
scope: [trip-delay, baggage]
currency: USD
requirements_dir: docs/requirements
topology:
  entry: AGT-TRV-ORCH
  agents:
    - ref: AGT-TRV-ORCH@0.2.0
    - ref: AGT-TRV-INTAKE@0.2.0
    - ref: AGT-TRV-DOC@0.2.0
    - ref: AGT-TRV-COV@0.2.0
    - ref: AGT-TRV-VER@0.2.0
    - ref: AGT-TRV-FRAUD@0.2.0
    - ref: AGT-TRV-ASSESS@0.2.0
    - ref: AGT-TRV-SETTLE@0.1.0
    - ref: AGT-TRV-COMMS@0.2.0
  delegation:
    - from: AGT-TRV-ORCH
      to: [AGT-TRV-INTAKE, AGT-TRV-DOC, AGT-TRV-COV, AGT-TRV-VER, AGT-TRV-FRAUD, AGT-TRV-ASSESS, AGT-TRV-SETTLE, AGT-TRV-COMMS]
  max_delegation_depth: 2
routing:
  rules: agents/orchestrator/src/routing.py
  stp_limit_usd: 1000
  significance_net_pct: 25
  confidence_cutoff: 0.7
hitl_points:
  - L1-approval
  - L1-L2-approval
  - investigation
  - siu-referral
evals:
  system: evals/system/suite.yaml
  thresholds: evals/thresholds.yaml
  require_component_evals: true
bundle_hash: "<generated by CI at release>"
