id: AGT-TRV-DOC
name: document
version: 0.2.0
role: subagent
owner: claims-ai-team
risk_tier: high
description: Extracts and cross-checks document data; chases missing documents.
requirements: [REQ-F-004, REQ-F-005, REQ-F-006]
model:
  provider: openrouter
  name: anthropic/claude-haiku-5.5   # fast tier (deploy/models.yaml)
  version: "5.5"
  params:
    temperature: 0.1
prompts:
  system: prompts/system.md
tools:
  - id: TOOL-DOCUMENT-STORE
    attach: [list_documents, read_text]   # read ops the model may call (create_react_agent)
guardrails: [pii-redaction, document-injection]
autonomy: act-within-scope
evals: evals/agents/document/suite.yaml
