id: AGT-TRV-COMMS
name: communication
version: 0.2.0
role: subagent
owner: claims-ai-team
risk_tier: high
description: Sends customer messages from approved templates.
requirements: [REQ-F-002, REQ-F-031, REQ-B-008]
model:
  provider: openrouter
  name: anthropic/claude-haiku-5.5   # fast tier (deploy/models.yaml)
  version: "5.5"
  params:
    temperature: 0.1
prompts:
  system: prompts/system.md
tools:
  - id: TOOL-NOTIFY
    # not attached: side-effecting, called by agent code only
  - id: TOOL-POLICY-WORDING
    attach: [get_clause]   # read ops the model may call (create_react_agent)
guardrails: [pii-redaction, document-injection]
autonomy: act-within-scope
evals: evals/agents/communication/suite.yaml
