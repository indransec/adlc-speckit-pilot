id: AGT-TRV-FRAUD
name: fraud-screening
version: 0.2.0
role: subagent
owner: claims-ai-team
risk_tier: high
description: Obtains SIU fraud score and flags anomalies. Never rejects.
requirements: [REQ-F-016, REQ-B-007]
model:
  provider: openrouter
  name: anthropic/claude-haiku-5.5   # fast tier (deploy/models.yaml)
  version: "5.5"
  params:
    temperature: 0.1
prompts:
  system: prompts/system.md
tools:
  - id: TOOL-FRAUD-SCORE
    attach: [score]   # read ops the model may call (create_react_agent)
guardrails: [pii-redaction, document-injection]
autonomy: flag-only
evals: evals/agents/fraud-screening/suite.yaml
