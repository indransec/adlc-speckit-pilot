  - {id: dataowner, name: Mei Chen, title: Data Owner (Claims data), team: governance, roles: ["Data owner"]}
  - {id: compliance, name: Laura Fischer, title: Compliance Officer, team: governance, roles: ["Compliance"]}
  - {id: rai, name: Samuel Reyes, title: RAI Officer, team: governance, roles: ["RAI/Risk"]}
  - {id: cab, name: Nora Mwangi, title: CAB Chair, team: governance, roles: ["CAB"]}
  - {id: architect, name: Victor Lindqvist, title: Enterprise Architect (ARB), team: governance, roles: ["Architecture"]}
  - {id: security, name: Nadia Haddad, title: Security Architect, team: governance, roles: ["Security"]}
  - {id: dpo, name: Ilse Jansen, title: Data Protection Officer, team: secops, roles: []}
