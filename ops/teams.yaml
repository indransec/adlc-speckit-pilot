# Dummy organisation for the end-to-end ADLC simulation. All people are fictional personas.
#
# roles     = ADLC approver roles exactly as named in shared/lifecycle.py GATES; a persona can sign
#             a gate only for a role it holds, and one persona fills at most one role per gate.
# user_id   = the persona's login in the adjuster workbench (users table), when it has one.
# on_call   = escalation order for alerts routed to the team (simulation step 3: GoAlert).
teams:
  - id: governance
    name: Governance and approvers
  - id: product-ai
    name: Product and AI leadership
  - id: ai-oncall
    name: AI Engineering on-call
    on_call: [ana, dev]
  - id: data-science
    name: Data Science
    on_call: [zoe, omar]
  - id: sre-oncall
    name: Platform SRE on-call
    on_call: [ravi, elena]
  - id: secops
    name: Security Operations
    on_call: [jonas, dpo]
  - id: siu
    name: Special Investigations Unit
    on_call: [siu-sam]
  - id: claims-ops
    name: Claims Operations

personas:
  # governance
  - {id: hoc, name: Helen Ortiz, title: Head of Claims (Travel), team: governance,
     roles: ["Sponsor (Head of Claims)", "Business owner (Head of Claims)", "Head of Claims"]}
